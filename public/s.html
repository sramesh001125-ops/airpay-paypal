<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm payment</title>
<style>body{font:18px/1.4 sans-serif;margin:16px;max-width:30em}a.b{display:block;margin-top:20px;padding:14px;background:#0b5fff;color:#fff;text-align:center;border-radius:6px;text-decoration:none}</style></head>
<body><h1>Confirm your payment</h1><p>Press the button, then send the message that opens. Never send your UPI PIN by message.</p>
<a id="go" class="b" href="#">Send confirmation SMS</a>
<script>var q=new URLSearchParams(location.search),k=q.get('k')||'',n=q.get('n')||'';if(/^\d{10}$/.test(k)&&n)document.getElementById('go').href='sms:'+n+'?body='+encodeURIComponent(k);else document.getElementById('go').textContent='Link not valid';</script></body></html>
